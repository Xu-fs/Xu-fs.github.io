<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Osmo Action 6</title>
    <style>
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}html{background:#0b1b31}body{position:relative;isolation:isolate;min-height:120vh;overflow-x:hidden;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}body:before{content:"";position:fixed;inset:-24px;z-index:-1;background:#0b1b31 url("../assets/action-background.jpg") center/cover no-repeat;filter:blur(13px) brightness(.82);transform:scale(1.04)}.back{position:fixed;top:28px;left:28px;display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border-radius:999px;color:#fff;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 2px rgba(255,255,255,.45),0 10px 28px rgba(0,0,0,.2);font-size:14px;text-decoration:none;transition:transform .2s ease,background .2s ease}.back:hover{background:rgba(255,255,255,.2);transform:translateX(-3px)}
      .site-nav{position:fixed;top:0;left:0;z-index:20;display:flex;width:100%;align-items:center;justify-content:space-between;padding:24px 48px;color:#fff;transition:background .35s ease,backdrop-filter .35s ease,box-shadow .35s ease,border-color .35s ease}.site-nav.scrolled{background:rgba(132,172,197,.18);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);border-bottom:1px solid rgba(255,255,255,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 30px rgba(7,31,50,.18)}.brand{color:#fff;font-size:24px;font-weight:600;letter-spacing:-.08em;text-decoration:none}.nav-links{display:flex;gap:38px;align-items:center}.nav-links a{color:rgba(255,255,255,.9);font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:18px;font-weight:900;line-height:1.1;letter-spacing:.02em;text-decoration:none;text-shadow:0 2px 8px rgba(6,24,38,.38);transition:color .2s}.nav-links a:hover{color:#d9f3ff}.nav-actions{display:flex;gap:12px;align-items:center}.glass-button{display:inline-flex;min-height:40px;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 1px 1px rgba(255,255,255,.24);color:#fff;cursor:pointer;font:500 14px Inter,sans-serif;padding:0 20px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.glass-icon{width:40px;padding:0}.menu-button{display:none}.mobile-menu{display:none}@media(max-width:1024px){.site-nav{padding:18px 24px}.nav-links{display:none}.menu-button{display:inline-flex}.mobile-menu{position:fixed;top:76px;left:12px;right:12px;z-index:19;padding:10px;border:1px solid rgba(255,255,255,.28);border-radius:16px;background:rgba(105,145,171,.22);box-shadow:0 12px 30px rgba(7,31,50,.18);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%)}.mobile-menu.open{display:block}.mobile-menu a{display:block;padding:12px;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:800;text-decoration:none}}@media(max-width:640px){.site-nav{padding:16px}.brand{font-size:21px}.search-button{display:none}.back{top:auto;bottom:20px;left:20px}}
      .site-nav{top:16px;left:24px;width:calc(100% - 48px);padding:20px 28px;border-radius:22px}.site-nav.scrolled{background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-color:transparent;box-shadow:none}.nav-links{gap:16px}.nav-links .nav-glass{padding:0 18px;color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:800;text-shadow:0 2px 8px rgba(6,24,38,.38)}.nav-back{color:#fff;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;font-weight:800;text-decoration:none;text-shadow:0 2px 8px rgba(6,24,38,.38);transition:color .2s}.nav-back:hover{color:#d9f3ff}@media(min-width:1025px){.site-nav .nav-links{position:absolute;left:50%;transform:translateX(-50%)}.site-nav .nav-actions{position:absolute;right:28px}}@media(max-width:1024px){.site-nav{left:16px;width:calc(100% - 32px);padding:18px 20px}.mobile-menu{top:96px}}@media(max-width:640px){.site-nav{left:12px;width:calc(100% - 24px);padding:16px 18px}.nav-back{font-size:14px}.mobile-menu{top:88px}}
    </style>
  </head>
  <body>
    <nav class="site-nav" id="site-nav">
      <a class="glass-button nav-glass nav-back" href="../index.html">← 返回摄影页</a>
      <div class="nav-links">
        <a class="glass-button nav-glass" href="/">首页</a><a class="glass-button nav-glass" href="/archives/">文章</a><a class="glass-button nav-glass" href="/music/">音乐</a><a class="glass-button nav-glass" href="/archives/">足迹</a><a class="glass-button nav-glass" href="/garage/">车库</a><a class="glass-button nav-glass" href="/friends/">友链</a>
      </div>
      <div class="nav-actions">
        <button class="glass-button search-button" type="button">Search ⌕</button>
        <button class="glass-button glass-icon" type="button" aria-label="Profile">◯</button>
        <button class="glass-button glass-icon menu-button" id="menu-button" type="button" aria-label="Toggle menu" aria-expanded="false">☰</button>
      </div>
    </nav>
    <div class="mobile-menu" id="mobile-menu">
      <a href="/">首页</a><a href="/archives/">文章</a><a href="/music/">音乐</a><a href="/archives/">足迹</a><a href="/garage/">车库</a><a href="/friends/">友链</a>
    </div>
    <script>
      const menuButton = document.getElementById('menu-button');
      const mobileMenu = document.getElementById('mobile-menu');
      menuButton.addEventListener('click', () => {
        const isOpen = mobileMenu.classList.toggle('open');
        menuButton.setAttribute('aria-expanded', isOpen);
        menuButton.textContent = isOpen ? '×' : '☰';
      });
    </script>
  </body>
</html>
