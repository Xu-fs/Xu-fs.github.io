<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Action 摄影配件与作品集" />
    <title>Action · Photography</title>
    <style>
      :root{color-scheme:light;--ink:#17181c;--muted:#6e7077;--blue:#0071e3;--surface:rgba(255,255,255,.76)}*{box-sizing:border-box}html{background:#f5f5f7}body{min-width:320px;margin:0;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at 12% 3%,#fff 0,transparent 25%),linear-gradient(180deg,#f7f7f9 0%,#eff2f4 100%)}.glass{border:1px solid rgba(255,255,255,.92);background:var(--surface);box-shadow:0 6px 18px rgba(25,35,45,.08),inset 0 1px 0 rgba(255,255,255,.98);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%)}.site-nav{position:sticky;top:14px;z-index:10;display:flex;align-items:center;justify-content:space-between;width:min(1500px,calc(100% - 48px));margin:14px auto 0;padding:12px 14px 12px 20px;border-radius:20px}.nav-title{font-size:14px;font-weight:800;letter-spacing:.12em;text-decoration:none}.nav-links{display:flex;gap:9px;align-items:center}.nav-link{padding:9px 14px;border-radius:999px;color:#34363b;font-size:14px;font-weight:700;text-decoration:none;transition:transform .2s,background .2s,color .2s}.nav-link:hover,.nav-link[aria-current="page"]{background:rgba(0,113,227,.1);color:#0065ca;transform:translateY(-1px)}main{width:min(100% - 100px,1920px);margin:48px auto 80px}.intro{margin:0 0 24px}.intro h1{margin:0;font-size:30px;letter-spacing:-.055em}.intro h1 span{color:#6c7280}.intro p{margin:8px 0 0;color:var(--muted);font-size:15px}.section{margin-top:48px}.section-header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:0 0 18px}.section-header h2{margin:0;font-size:27px;letter-spacing:-.045em}.section-header p{margin:0;color:var(--muted);font-size:15px}.product-row{display:flex;gap:18px;overflow-x:auto;padding:0 0 14px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:#c4c9ce transparent}.product-card{position:relative;display:flex;flex:0 0 min(382px,calc(100vw - 64px));min-height:470px;flex-direction:column;overflow:hidden;padding:27px;border-radius:22px;color:var(--ink);text-decoration:none;scroll-snap-align:start;transition:transform .25s ease,box-shadow .25s ease}.product-card:hover{box-shadow:0 14px 32px rgba(24,37,49,.14),inset 0 1px 0 #fff;transform:translateY(-5px)}.tag{min-height:16px;margin:0 0 10px;color:#d75a00;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}.product-card h3{margin:0;font-size:28px;letter-spacing:-.055em}.product-image{display:grid;flex:1;place-items:center;min-height:230px;padding:22px 0}.product-image img{max-width:88%;max-height:235px;filter:drop-shadow(0 18px 10px rgba(15,35,50,.2));object-fit:contain}.placeholder-art{display:grid;width:78%;aspect-ratio:1.45;place-items:center;border-radius:22px;background:linear-gradient(135deg,rgba(129,188,216,.48),rgba(255,255,255,.78));color:#476474;font-size:16px;font-weight:800;letter-spacing:.08em}.dots{display:flex;justify-content:center;gap:8px;height:17px}.dots i{width:10px;height:10px;border-radius:50%;background:#cad2d8;box-shadow:inset 0 1px 1px rgba(0,0,0,.08)}.dots i:nth-child(2){background:#a3c0cd}.dots i:nth-child(3){background:#65798a}.card-bottom{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-top:18px}.card-meta{display:grid;gap:5px;color:#535861;font-size:13px;line-height:1.35}.card-meta strong{color:#191b20;font-weight:800}.detail-button{flex:none;padding:10px 16px;border-radius:999px;background:var(--blue);box-shadow:inset 0 1px 0 rgba(255,255,255,.34);color:#fff;font-size:14px;font-weight:800}.empty{display:grid;min-width:100%;min-height:220px;place-items:center;border-radius:22px;color:var(--muted);font-size:15px;text-align:center}.note{margin:28px 0 0;color:#7a7e86;font-size:13px;text-align:center}.note code{padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.05);color:#31343a}@media(max-width:720px){.site-nav{width:calc(100% - 24px);padding:10px 12px}.nav-title{display:none}.nav-links{width:100%;justify-content:space-between}.nav-link{padding:8px 10px;font-size:13px}main{width:calc(100% - 32px);margin-top:36px}.section{margin-top:38px}.product-card{min-height:438px;padding:23px}.product-card h3{font-size:25px}}@media(max-width:430px){.nav-link{font-size:12px;padding:8px}.intro h1{font-size:27px}.section-header{align-items:start;flex-direction:column;gap:6px}.product-card{flex-basis:calc(100vw - 48px)}}
      :root{--muted:#314856}html,body{min-height:100%;background-color:#dce7eb}body{min-height:100vh;background:linear-gradient(rgba(247,250,252,.6),rgba(239,244,247,.7)),url("images/action-background.jpg") center/cover fixed}.intro h1 span{color:#3c5361}.note{color:#314856}.section#accessories .section-header p{color:#1d3645;font-weight:800}.site-nav{justify-content:flex-start;width:calc(100% - 100px);max-width:1920px;margin-top:0;padding:10px 0 0;background:transparent;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}main{margin:24px auto 0;padding-bottom:24px}.site-nav .nav-link{padding:11px 19px;border-color:rgba(255,255,255,.52);background:rgba(124,166,186,.2);box-shadow:inset 0 1px 1px rgba(255,255,255,.52),inset 0 -1px 1px rgba(255,255,255,.12),0 7px 18px rgba(25,55,72,.16);color:#fff;font-size:16px;text-shadow:0 1px 5px rgba(18,49,67,.45);backdrop-filter:blur(16px) saturate(145%);-webkit-backdrop-filter:blur(16px) saturate(145%)}.site-nav .nav-links{position:absolute;left:50%;gap:22px;transform:translateX(-50%)}@media(max-width:720px){.site-nav{width:calc(100% - 24px);overflow-x:auto}.site-nav .nav-links{position:static;width:auto;transform:none;justify-content:flex-start;flex:none}.site-nav .nav-link{white-space:nowrap}}
    </style>
  </head>
  <body>
    <nav class="site-nav" aria-label="Action 页面导航">
      <a class="nav-link glass" href="../index.html">返回摄影页</a>
      <div class="nav-links">
        <a class="nav-link glass" href="/">首页</a>
        <a class="nav-link glass" href="/archives/">文章</a>
        <a class="nav-link glass" href="/music/">音乐</a>
        <a class="nav-link glass" href="/archives/">足迹</a>
        <a class="nav-link glass" href="/garage/">车库</a>
        <a class="nav-link glass" href="/friends/">友链</a>
      </div>
    </nav>

    <main>
      <header class="intro">
        <h1>全部配件。<span>挑你所爱。</span></h1>
      </header>

      <section class="section" id="accessories" aria-labelledby="accessories-title">
        <div class="section-header"><h2 id="accessories-title">配件区</h2><p>点击卡片阅读详情文章</p></div>
        <div class="product-row" id="accessory-grid" aria-live="polite"></div>
      </section>

      <section class="section" id="works" aria-labelledby="works-title">
        <div class="section-header"><h2 id="works-title">作品区</h2><p>影像、笔记与拍摄记录</p></div>
        <div class="product-row" id="work-grid" aria-live="polite"></div>
      </section>
      <p class="note">编辑 <code>README.md</code> 内的表格即可维护配件与作品。</p>
    </main>

    <script>
      const escapeHtml = (value = '') => value.replace(/[&<>'"]/g, character => ({ '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;' })[character]);
      function readTable(markdown, section) { const match = markdown.match(new RegExp(`<!-- ${section}_START -->([\\s\\S]*?)<!-- ${section}_END -->`)); return match ? match[1].split('\n').filter(line => line.trim().startsWith('|')).slice(2).map(line => line.split('|').slice(1,-1).map(cell => cell.trim())).filter(row => row.length) : []; }
      function empty(message) { return `<div class="empty glass">${message}</div>`; }
      function accessoryCard([name, brand, purchased, score, article, image]) { const imagePath = image || 'images/osmo-action-6.png'; return `<a class="product-card glass" href="${escapeHtml(article)}"><p class="tag">配件档案</p><h3>${escapeHtml(name)}</h3><div class="product-image"><img src="${escapeHtml(imagePath)}" alt="${escapeHtml(name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder-art',textContent:'ACTION'}))"></div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="card-bottom"><div class="card-meta"><span>${escapeHtml(brand)} · ${escapeHtml(purchased)}</span><strong>评分 ★ ${escapeHtml(score)}</strong></div><span class="detail-button">详情</span></div></a>`; }
      function workCard([title, date, description, article, image]) { const visual = image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(title)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'placeholder-art',textContent:'ACTION WORK'}))">` : '<div class="placeholder-art">ACTION WORK</div>'; return `<a class="product-card glass" href="${escapeHtml(article)}"><p class="tag">作品记录</p><h3>${escapeHtml(title)}</h3><div class="product-image">${visual}</div><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div><div class="card-bottom"><div class="card-meta"><span>${escapeHtml(date)}</span><strong>${escapeHtml(description)}</strong></div><span class="detail-button">查看</span></div></a>`; }
      function renderAccessories(rows) { document.getElementById('accessory-grid').innerHTML = rows.length ? rows.map(accessoryCard).join('') : empty('还没有配件记录。请在 README.md 的“配件区”表格中添加一行。'); }
      function renderWorks(rows) { document.getElementById('work-grid').innerHTML = rows.length ? rows.map(workCard).join('') : empty('还没有作品记录。请在 README.md 的“作品区”表格中添加一行。'); }
      renderAccessories([['Osmo Action 6','DJI','待填写','待评分','articles/osmo-action-6.html','images/osmo-action-6.png']]); renderWorks([]);
      fetch('./README.md').then(response => { if (!response.ok) throw new Error(); return response.text(); }).then(markdown => { renderAccessories(readTable(markdown,'ACCESSORIES')); renderWorks(readTable(markdown,'WORKS')); }).catch(() => {});
    </script>
  </body>
</html>
